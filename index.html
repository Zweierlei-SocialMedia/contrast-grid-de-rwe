<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EightShapes Contrast Grid</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,400i,700" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div class="es-web-tool__flex-container">
        <div class="es-web-tool__outer-wrap">
            <div class="es-web-tool__body">
                <div class="es-web-tool__configurator">
                    <div class="es-web-tool__sidebar">
                        <h1 class="es-web-tool__title">
                            <a href="http://eightshapes.com">
                                <es-icon name="eightshapes-mark" class="es-web-tool__title-logo"></es-icon>
                            </a>
                            <span class="es-web-tool__title-text">Contrast Grid</span>
                        </h1>
                        <es-color-form></es-color-form>
                        <div class="es-web-tool__sidebar-actions">
                            <div class="es-web-tool__sidebar-ctas">
                                <button class="es-code-toggle es-button">Copy Grid HTML &amp; CSS</button>
                                <a class="es-button es-web-tool__external-link--twitter" id="es-share-on-twitter-link" href="http://twitter.com/home?status=Test%20your%20entire%20color%20palette%20for%20accessibility.%20http://contrast-grid.eightshapes.com%20@eightshapes&amp;source=webclient">
                                    <es-icon name="twitter" class="es-web-tool__external-link-logo es-button__icon"></es-icon>
                                    <span class="es-web-tool__external-link-text">
                                        Tweet My Grid
                                    </span>
                                </a>
                            </div>

                            <div class="es-web-tool__external-links-wrap">
                                <a class="es-web-tool__external-link es-web-tool__external-link--github" href="http://www.directededges.com/">
                                    <span class="es-web-tool__external-link-text">
                                        By Directed Edges (formerly, Eightshapes)
                                    </span>
                                </a>
                                <div class="es-web-tool__external-link-separator">
                                </div>
                                <a class="es-web-tool__external-link es-web-tool__external-link--github" href="https://github.com/EightShapes/contrast-grid">
                                    <es-icon name="github" class="es-web-tool__external-link-logo"></es-icon>
                                    <span class="es-web-tool__external-link-text">
                                        On Github
                                    </span>
                                </a>
                            </div>

                            <p class="es-web-tool__legal">
                                &copy; Copyright Eightshapes, LLC 2017-2021
                            </p>
                        </div>
                    </div>
                    <div class="es-web-tool__results">
                        <es-contrast-grid></es-contrast-grid>
                    </div>
                </div>
                <es-code-snippet></es-code-snippet>
            </div>
        </div>
    </div>
</body>
</html>
